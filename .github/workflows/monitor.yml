name: Website Monitor

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Test
        run: |
          curl \
          -H "Content-Type: application/json" \
          -X POST \
          -d '{"content":"✅ Watchwise test notification is working!"}' \
          "${{ secrets.DISCORD_WEBHOOK }}"