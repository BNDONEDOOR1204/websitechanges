name: BOYNEXTDOOR Stock Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: boynextdoor-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check all three versions
        run: node monitor.js

      - name: Show results
        run: |
          cat monitor-result.json

      - name: Prepare Discord alert
        run: |
          node <<'NODE'
          const fs = require("fs");

          const result = require("./monitor-result.json");

          if (!result.changed) {
            fs.writeFileSync(
              "discord-payload.json",
              JSON.stringify({
                content: "No product version changed."
              })
            );
            process.exit(0);
          }

          const details = result.changedVersions
            .map((change) => {
              return (
                "**" + change.version + "**\n" +
                "Previous: " + change.previousStatus + "\n" +
                "Current: " + change.currentStatus
              );
            })
            .join("\n\n");

          const message =
            "🚨 **BOYNEXTDOOR STOCK CHANGED**\n\n" +
            details +
            "\n\n" +
            result.url;

          fs.writeFileSync(
            "discord-payload.json",
            JSON.stringify({
              content: message
            })
          );
          NODE

      - name: Send Discord alert
        if: ${{ hashFiles('monitor-result.json') != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          CHANGED=$(node -p "require('./monitor-result.json').changed")

          if [ "$CHANGED" != "true" ]; then
            echo "No version changed."
            exit 0
          fi

          curl \
            --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK"

      - name: Save status baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous-status.json current-status.json monitor-result.json

          git add previous-*.png || true

          if git diff --cached --quiet; then
            echo "No baseline changes to save."
            exit 0
          fi

          git pull --rebase origin main || true

          git commit -m "Update BOYNEXTDOOR stock baseline" || true

          git push origin main || true