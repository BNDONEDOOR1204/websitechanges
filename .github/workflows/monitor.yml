name: Website Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Website
        run: |
          URL=$(grep -o 'https://[^"]*' monitors.json | head -1)

          echo "Monitoring: $URL"

          curl -L "$URL" -o latest.html

      - name: Show File Details
        run: |
          ls -lh latest.html
          wc -c latest.html