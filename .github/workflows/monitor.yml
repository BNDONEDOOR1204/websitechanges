name: Website Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Website
        run: |
          URL=$(grep -o 'https://[^"]*' monitors.json | head -1)

          echo "Monitoring: $URL"

          curl -L "$URL" > latest.html

          wc -c latest